# Netlify config for the generated site.
# The output directory IS the deployable site — there is no build step on
# Netlify's side; `generate.py` produces final static files.
#
# Local preview:
#   python generate.py content/<name>.txt --out dist/<name> --watch --serve
#
# Netlify serves pretty URLs by default (/services -> services.html).
#
# The contact form is a Netlify Form (the `netlify` attribute in
# contact/index.html). Two caveats:
#   - Form detection is off by default for new sites: enable it under
#     Site configuration > Forms, then redeploy. Until then, submitting
#     returns "Page not found".
#   - `netlify dev` does not process form submissions; a local POST returns
#     405 Method Not Allowed. Use `generate.py --serve` to test it locally.

[build]
  publish = "."

[dev]
  publish = "."
